<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <base href="https://dewdropdynastyfilepass.weight-joseph1.workers.dev/">
  <title>Dewdrop Dynasty</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
    body { touch-action:none; }
    #canvas { display:block; width:100vw; height:100vh; border:0; outline:none; background:#000; }
    #status {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      color:#eee; font:14px Arial,sans-serif; text-align:center; padding:20px;
      box-sizing:border-box; pointer-events:none;
    }
    #status:empty { display:none; }
  </style>
  <script src="https://dewdropdynastyfilepass.weight-joseph1.workers.dev/Dewdrop%20Dynasty.js"></script>
</head>
<body>
  <canvas id="canvas" tabindex="0">Your browser does not support HTML5 canvas.</canvas>
  <div id="status">Loading Dewdrop Dynasty…</div>
  <script>
    const status = document.getElementById("status");
    function report(message) {
      console.error(message);
      status.textContent += "\\n" + String(message);
    }
    window.addEventListener("error", function(event) {
      report("Browser error: " + (event.message || "unknown") +
        (event.filename ? " (" + event.filename + ":" + event.lineno + ")" : ""));
    });
    window.addEventListener("unhandledrejection", function(event) {
      const reason = event.reason;
      report("Promise error: " + (reason && reason.message ? reason.message : String(reason)));
    });
    const GODOT_CONFIG = {
      args: [],
      canvas: document.getElementById("canvas"),
      canvasResizePolicy: 2,
      executable: "Dewdrop Dynasty",
      experimentalVK: false,
      fileSizes: {
        "Dewdrop Dynasty.pck": 256274816,
        "Dewdrop Dynasty.wasm": 36751647
      },
      focusCanvas: true,
      gdextensionLibs: [],
      onPrint: function(message) { report("Godot: " + message); },
      onPrintError: function(message) { report("Godot error: " + message); },
      onExit: function(code) { report("Godot exited with code " + code); }
    };
    try {
      const engine = new Engine(GODOT_CONFIG);
      engine.startGame({
        onProgress: function(current, total) {
          if (total > 0) status.textContent = "Loading Dewdrop Dynasty… " + Math.round((current / total) * 100) + "%";
        }
      }).then(function() {
        status.textContent = "";
      }).catch(function(error) {
        console.error(error);
        status.textContent = "Could not start Dewdrop Dynasty: " + (error && error.message ? error.message : error);
      });
    } catch (error) {
      console.error(error);
      status.textContent = "Could not load the game engine: " + (error && error.message ? error.message : error);
    }
  </script>
</body>
</html>
