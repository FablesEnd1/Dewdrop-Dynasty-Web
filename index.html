<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no">
  <title>Dewdrop Dynasty</title>
  <base href="https://dewdropdynastyfilepass.weight-joseph1.workers.dev/">
  <style>
    html, body {
      margin: 0;
      border: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    body { touch-action: none; }
    #canvas {
      display: block;
      margin: 0;
      width: 100vw;
      height: 100vh;
      color: white;
      background: #000;
      outline: none;
    }
    #status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #eee;
      background: #000;
      font: 14px Arial, sans-serif;
      text-align: center;
      white-space: pre-wrap;
      padding: 20px;
      box-sizing: border-box;
      pointer-events: none;
    }
    #status:empty { display: none; }
  </style>
  <script src="https://dewdropdynastyfilepass.weight-joseph1.workers.dev/Dewdrop%20Dynasty.js"></script>
</head>
<body>
  <canvas id="canvas" tabindex="0">
    HTML5 canvas appears to be unsupported in this browser.
  </canvas>
  <div id="status">Loading Dewdrop Dynasty…</div>

  <script>
    const status = document.getElementById("status");

    function showError(error) {
      const message = error && error.message ? error.message : String(error);
      console.error(error);
      status.textContent = "Could not start Dewdrop Dynasty:\n" + message;
    }

    window.addEventListener("error", function(event) {
      showError(event.message || "Unknown browser error");
    });

    window.addEventListener("unhandledrejection", function(event) {
      showError(event.reason || "Unknown promise error");
    });

    const GODOT_CONFIG = {
      args: [],
      canvasResizePolicy: 2,
      executable: "Dewdrop Dynasty",
      experimentalVK: false,
      fileSizes: {
        "Dewdrop Dynasty.pck": 256274816,
        "Dewdrop Dynasty.wasm": 36751647
      },
      focusCanvas: true,
      gdextensionLibs: []
    };

    const missing = Engine.getMissingFeatures();

    if (missing.length) {
      status.textContent =
        "This browser is missing required Godot features:\n" +
        missing.join("\n");
    } else {
      const engine = new Engine(GODOT_CONFIG);

      engine.startGame({
        onProgress: function(current, total) {
          if (total > 0) {
            status.textContent =
              "Loading Dewdrop Dynasty… " +
              Math.round((current / total) * 100) + "%";
          } else {
            status.textContent = "Starting Dewdrop Dynasty…";
          }
        }
      }).then(function() {
        status.textContent = "";
      }).catch(showError);
    }
  </script>
</body>
</html>
